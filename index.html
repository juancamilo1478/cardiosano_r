<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Abrir Cardiosano</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        window.onload = function () {
            const params = new URLSearchParams(window.location.search);
            const t = params.get("t");

            // Redirige al deep link
            window.location.href = `cardiosano://caregiver-invite?t=${t}`;

            // Si no tiene app, después de 2s muéstrale una opción para instalarla
            setTimeout(() => {
                document.getElementById("fallback").style.display = "block";
            }, 2000);
        }
    </script>
</head>

<body>
    <h2>Abriendo Cardiosano…</h2>

    <div id="fallback" style="display: none; margin-top: 20px;">
        <p>No tienes la app instalada.</p>
        <!-- <a href="https://play.google.com/store/apps/details?id=com.cardiosano.app">Instalar app</a> -->
    </div>
</body>

</html>
